[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "labnotes"
dynamic = ["version"]
description = "Browse experiment designs, notes, and run data from a folder."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Kevin Scott", email = "me@thekevinscott.com" }]
dependencies = [
    "click>=8.5.0",
    "dirsql>=0.4.110",
    "filelock>=4.2.0",
    "haikunator>=2.1.0",
    "ipykernel>=7.4.0",
    "jinja2>=3.1.6",
    "jupyter-client>=8.10.0",
    "markdown-it-py>=4.2.0",
    "pyyaml>=6.0.3",
    "rich>=14",
    "starlette>=1.8.0",
    "textual>=8.2.8",
    "uvicorn>=0.54.0",
]

[project.urls]
Repository = "https://github.com/thekevinscott/labnotes"

[project.scripts]
labnotes = "labnotes.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=8.0",
    "ruff==0.8.4",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
local_scheme = "no-local-version"

[tool.hatch.build]
exclude = ["*_test.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/labnotes"]

[tool.pytest.ini_options]
testpaths = ["src/labnotes", "tests"]
python_files = "*_test.py"

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F) plus TID252: imports are absolute, never
# relative (PEP 8). See docs/internals/python/style.md.
select = ["E4", "E7", "E9", "F", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# haikunator ships no type hints.
[[tool.mypy.overrides]]
module = ["haikunator"]
ignore_missing_imports = true
