name: PR Monitor

on:
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  monitor:
    name: 'CI Gate'
    runs-on: ubuntu-latest
    # Backstop for a slow lane only; pr-monitor fails a run that never
    # starts on its own. Mutation can queue for a runner, then take ~2h.
    timeout-minutes: 150
    steps:
      - uses: thekevinscott/pr-monitor@v1
