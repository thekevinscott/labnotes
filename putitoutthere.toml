[putitoutthere]
version = 1

# Split root files from subtrees to keep gate config and bookkeeping out
# of releases. Use extglobs: leading ! patterns do not subtract matches.

[[package]]
name = "labnotes"
kind = "pypi"
path = "packages/python"
first_version = "0.0.1"
build = "hatch"
tag_format = "v{version}"
globs = [
  "packages/python/!(testing-conventions.toml)",
  "packages/python/!(changelog.d|migrations.d|e2e-attestations)/**",
  "LICENSE",
]
