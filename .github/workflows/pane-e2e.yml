name: Pane e2e

on:
  pull_request:
    paths:
      - 'skills/labnotes/**'
      - 'packages/python/src/labnotes/daemon/**'
      - 'packages/python/src/labnotes/runner/**'
      - 'packages/python/src/labnotes/run_status.py'
      - 'packages/python/src/labnotes/run_control.py'
      - 'packages/python/tests/e2e/**'
      - '.github/workflows/pane-e2e.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (pane in a real claude)
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_VERSION: 2.1.310
      DISABLE_AUTOUPDATER: 1
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: claude --version
      - run: uv run pytest tests/e2e
