name: Testing Conventions

# Enforce the testing-conventions standard on this repo's packages: every
# source file must have a colocated unit test (`foo.py` -> `foo_test.py`).
# Calls the upstream reusable workflow, which installs the published
# `testing-conventions` binary and runs each rule as its own job, failing the
# build on any violation.
#   https://github.com/thekevinscott/testing-conventions
#
# Pinned to a main commit, not `v0`: upstream can't publish to PyPI, so v0 is
# stuck on an adapter that rejects --lines. Return to @v0 once releases resume.

on:
  pull_request:
    paths:
      - 'packages/**'
      - '!packages/*/changelog.d/**'
      - '!packages/*/migrations.d/**'
      - '.github/workflows/conventions.yml'

permissions:
  contents: read

jobs:
  python:
    name: Python
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@b819f22c6bcd06fb0fdba35b294022a5c14b659c
    with:
      languages: '["python"]'
      source: packages/python
