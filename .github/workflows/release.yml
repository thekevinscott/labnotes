name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_packages:
        description: 'Comma-separated name[@bump|version] list'
        required: true

jobs:
  # Preflight gate for first-publish prerequisites. Fails fast with an
  # actionable error before the reusable workflow runs, so a misconfigured
  # release does not produce confusing 404s deep in the publish step.
  #
  # Skipped in the template repo itself (Settings -> Template repository),
  # which has no real packages to publish. Forks and repos created via
  # "Use this template" don't inherit that flag, so they release normally.
  # Every downstream job needs this one, so the whole run is skipped.
  preflight:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - name: Repo visibility check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          private=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)
          if [ "$private" = "true" ]; then
            echo "::error::Repository is private. Trusted Publishing on PyPI requires a public repository so the provider can inspect the workflow file at the configured ref. Make the repo public (Settings -> General -> Danger Zone -> Change visibility) before releasing, or remove this preflight step if you have an alternative publish path."
            exit 1
          fi
          echo "Repo is public; OK to proceed."

  release:
    needs: preflight
    uses: thekevinscott/putitoutthere/.github/workflows/release.yml@v0
    permissions:
      contents: write
      id-token: write
    with:
      release_packages: ${{ inputs.release_packages }}

  # PyPI upload runs in the caller's workflow context. Required because
  # PyPI Trusted Publishers can't validate OIDC tokens minted from a
  # cross-repo reusable workflow (pypi/warehouse#11096). `pypi_pending` is
  # only 'true' when the release job handed this job an upload.
  pypi-publish:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.pypi_pending == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-sdist'
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-wheel-*'
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The release job leaves a PyPI package untagged until its upload lands.
  # `expect` names the uploaded versions, since PyPI's "latest version"
  # lookup does not yet know about a fresh publish.
  pypi-tag:
    needs: [release, pypi-publish]
    if: ${{ !cancelled() && needs.pypi-publish.result == 'success' }}
    uses: thekevinscott/putitoutthere/.github/workflows/pypi-tag.yml@v0
    permissions:
      contents: write
    with:
      expect: ${{ needs.release.outputs.delegated_packages }}
