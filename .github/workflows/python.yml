name: Python

on:
  pull_request:
    paths:
      - 'packages/python/**'
      - '!packages/*/changelog.d/**'
      - '!packages/*/migrations.d/**'
      - '.github/workflows/python.yml'

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      # Pinned to match the ruff-pre-commit rev in .pre-commit-config.yaml.
      - run: uvx ruff@0.8.4 check .
      - run: uvx ruff@0.8.4 format --check .

  test:
    name: Test (pytest, mypy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run pytest src/labnotes tests
      - run: uv run mypy src

  build:
    name: Build wheel + uvx smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv build
        working-directory: packages/python
      - run: uvx --from packages/python/dist/*.whl labnotes --version
